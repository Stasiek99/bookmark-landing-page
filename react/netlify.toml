# Netlify build settings for the React version.
# Monorepo: create the site with "Base directory" = react (paths below are relative to it).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vitest 5 and the toolchain need Node 22.12+; this is the version the project was developed on.
  NODE_VERSION = "24"
